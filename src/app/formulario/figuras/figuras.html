<div class="col-6">
    <div class="mmb-3">

        <form>

            <label>Seleccione una figura:</label>

            <div>
                <input type="radio" name="operacion" value="rectangulo"[(ngModel)]="operacion">
                <label> Rectangulo</label>
            </div>

            <div>
                <input type="radio" name="operacion" value="cuadrado"[(ngModel)]="operacion">
                <label> Cuadrado</label>
            </div>

            <div>
                <input type="radio" name="operacion" value="triangulo"[(ngModel)]="operacion">
                <label> Triangulo</label>
            </div>

            <div>
                <input type="radio" name="operacion" value="circulo"[(ngModel)]="operacion">
                <label> Circulo</label>
            </div>
               <div>
                <input type="radio" name="operacion" value="pentagono"[(ngModel)]="operacion">
                <label>Pentagono</label>
            </div>

            <br>

                   <div class="form-group pt-4">
                <label for="num1">Numero 1:</label>
                <input [(ngModel)]="num1"type="text"name="num1"class="form-control"id="num1"placeholder="Ingrese numero 1">
            </div>

            <br>

            <div class="form-group pt-4">
                <label for="num2">Numero 2:</label>
                <input [(ngModel)]="num2"type="text"name="num2"class="form-control"id="num2"placeholder="Ingrese numero 2">
            </div>

            <br>
            

            <button (click)="calcular()"
                    type="button"
                    class="btn btn-primary">
                Calcular Area
            </button>

        </form>

    </div>
</div>
