
<div class="col-6">
    <div class="mmb-3">

        <form>

            <div class="form-group pt-4">
                <label for="num1">Numero 1:</label>
                <input [(ngModel)]="num1"type="text"name="num1"class="form-control"id="num1"placeholder="Ingrese numero 1">
            </div>

            <br>

            <div class="form-group pt-4">
                <label for="num2">Numero 2:</label>
                <input [(ngModel)]="num2"type="text"name="num2"class="form-control"id="num2"placeholder="Ingrese numero 2">
            </div>

            <br>

            <label>Seleccione una operación:</label>

            <div>
                <input type="radio" name="operacion" value="sumar"[(ngModel)]="operacion">
                <label> Sumar</label>
            </div>

            <div>
                <input type="radio" name="operacion" value="restar"[(ngModel)]="operacion">
                <label> Restar</label>
            </div>

            <div>
                <input type="radio" name="operacion" value="multiplicar"[(ngModel)]="operacion">
                <label> Multiplicar</label>
            </div>

            <div>
                <input type="radio" name="operacion" value="dividir"[(ngModel)]="operacion">
                <label> Dividir</label>
            </div>

            <br>

            <button (click)="calcular()"
                    type="button"
                    class="btn btn-primary">
                Calcular
            </button>

        </form>

    </div>
</div>
